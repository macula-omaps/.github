<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Xomaps Culture Wall</title>
  <desc>Xomaps culture: core — trust as the root, simplicity as the ground; mission and vision; five values Trust, Simplicity, Cycle, Expansion, Path; slogan: build the road with trust and simplicity, go far through cycles and expansion</desc>
  <rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/>
  <rect x="40" y="36" width="8" height="8" fill="#0F6E56"/>
  <text x="58" y="46" font-size="22" font-weight="500" fill="#04342C" font-family="Helvetica, Arial, sans-serif">Xomaps Culture</text>
  <text x="640" y="46" font-size="13" fill="#5F5E5A" text-anchor="end" font-family="Helvetica, Arial, sans-serif">Core: trust as the root, simplicity as the ground</text>

  <rect x="40" y="70" width="295" height="78" rx="10" fill="#F1EFE8"/>
  <text x="60" y="94" font-size="12" font-weight="500" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Mission</text>
  <text x="60" y="116" font-size="12" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Trustworthy engineering across the full chain —</text>
  <text x="60" y="134" font-size="12" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">assets keep compounding, business keeps evolving</text>

  <rect x="345" y="70" width="295" height="78" rx="10" fill="#F1EFE8"/>
  <text x="365" y="94" font-size="12" font-weight="500" fill="#0F6E56" font-family="Helvetica, Arial, sans-serif">Vision</text>
  <text x="365" y="116" font-size="12" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">The full-chain partner enterprises can</text>
  <text x="365" y="134" font-size="12" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">entrust and grow with</text>

  <text x="40" y="182" font-size="12" font-weight="500" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">Values</text>

  <rect x="40" y="192" width="112" height="112" rx="10" fill="#0F6E56"/>
  <text x="96" y="236" font-size="26" font-weight="500" fill="#E1F5EE" text-anchor="middle" font-family="PingFang SC, sans-serif">信</text>
  <text x="96" y="264" font-size="11" fill="#E1F5EE" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Do what we say</text>
  <text x="96" y="284" font-size="11" fill="#E1F5EE" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Worth entrusting</text>

  <rect x="162" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="218" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">朴</text>
  <text x="218" y="264" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Back to essentials</text>
  <text x="218" y="284" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Cut complexity</text>

  <rect x="284" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">循</text>
  <text x="340" y="264" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Close loops</text>
  <text x="340" y="284" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Keep polishing</text>

  <rect x="406" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="462" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">拓</text>
  <text x="462" y="264" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Root downward</text>
  <text x="462" y="284" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Reach outward</text>

  <rect x="528" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="584" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">路</text>
  <text x="584" y="264" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Respect context</text>
  <text x="584" y="284" font-size="11" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">No templates</text>

  <rect x="40" y="324" width="600" height="60" rx="10" fill="#0F6E56"/>
  <text x="340" y="352" font-size="16" font-weight="500" fill="#E1F5EE" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Build the road with trust and simplicity — go far through cycles and expansion</text>
  <text x="340" y="374" font-size="12" fill="#9FE1CB" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Positioning: AI-native by experience · Engineering first · Open by design</text>

  <rect x="40" y="400" width="600" height="40" rx="10" fill="#F1EFE8"/>
  <text x="340" y="425" font-size="13" fill="#2C2C2A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Short form: trust that delivers, simplicity that lasts — cycles compound, paths grow</text>
</svg>
