<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>信朴科技 · Xomaps 企业文化墙</title>
  <desc>信朴科技企业文化：内核信为本朴为根；使命与愿景；五字价值观信朴循拓路；口号信朴筑路，循拓致远</desc>
  <rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/>
  <rect x="40" y="36" width="8" height="8" fill="#0F6E56"/>
  <text x="58" y="46" font-size="22" font-weight="500" fill="#04342C" font-family="PingFang SC, sans-serif">信朴 · Xomaps 企业文化</text>
  <text x="640" y="46" font-size="13" fill="#5F5E5A" text-anchor="end" font-family="PingFang SC, sans-serif">内核：信为本，朴为根</text>

  <rect x="40" y="70" width="295" height="78" rx="10" fill="#F1EFE8"/>
  <text x="60" y="94" font-size="12" font-weight="500" fill="#0F6E56" font-family="PingFang SC, sans-serif">使命</text>
  <text x="60" y="116" font-size="13" fill="#2C2C2A" font-family="PingFang SC, sans-serif">以可信的工程能力贯穿业务全链</text>
  <text x="60" y="134" font-size="13" fill="#2C2C2A" font-family="PingFang SC, sans-serif">路，让资产持续沉淀、自主演进</text>

  <rect x="345" y="70" width="295" height="78" rx="10" fill="#F1EFE8"/>
  <text x="365" y="94" font-size="12" font-weight="500" fill="#0F6E56" font-family="PingFang SC, sans-serif">愿景</text>
  <text x="365" y="116" font-size="13" fill="#2C2C2A" font-family="PingFang SC, sans-serif">成为企业可托付、与业务共生长</text>
  <text x="365" y="134" font-size="13" fill="#2C2C2A" font-family="PingFang SC, sans-serif">的全链路伙伴</text>

  <text x="40" y="182" font-size="12" font-weight="500" fill="#5F5E5A" font-family="PingFang SC, sans-serif">价值观</text>

  <rect x="40" y="192" width="112" height="112" rx="10" fill="#0F6E56"/>
  <text x="96" y="236" font-size="26" font-weight="500" fill="#E1F5EE" text-anchor="middle" font-family="PingFang SC, sans-serif">信</text>
  <text x="96" y="264" font-size="12" fill="#E1F5EE" text-anchor="middle" font-family="PingFang SC, sans-serif">言出必行</text>
  <text x="96" y="284" font-size="12" fill="#E1F5EE" text-anchor="middle" font-family="PingFang SC, sans-serif">值得托付</text>

  <rect x="162" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="218" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">朴</text>
  <text x="218" y="264" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">回归本质</text>
  <text x="218" y="284" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">删繁就简</text>

  <rect x="284" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">循</text>
  <text x="340" y="264" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">闭环沉淀</text>
  <text x="340" y="284" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">持续打磨</text>

  <rect x="406" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="462" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">拓</text>
  <text x="462" y="264" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">向下扎根</text>
  <text x="462" y="284" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">向外拓界</text>

  <rect x="528" y="192" width="112" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="584" y="236" font-size="26" font-weight="500" fill="#085041" text-anchor="middle" font-family="PingFang SC, sans-serif">路</text>
  <text x="584" y="264" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">尊重脉络</text>
  <text x="584" y="284" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">自成路径</text>

  <rect x="40" y="324" width="600" height="60" rx="10" fill="#0F6E56"/>
  <text x="340" y="352" font-size="18" font-weight="500" fill="#E1F5EE" text-anchor="middle" font-family="PingFang SC, sans-serif">口号：信朴筑路，循拓致远</text>
  <text x="340" y="374" font-size="12" fill="#9FE1CB" text-anchor="middle" font-family="PingFang SC, sans-serif">长版：循周期沉淀，向无限突破 · 定位：亲历 AI Native，工程为本，开放为翼</text>

  <rect x="40" y="400" width="600" height="40" rx="10" fill="#F1EFE8"/>
  <text x="340" y="425" font-size="13" fill="#2C2C2A" text-anchor="middle" font-family="PingFang SC, sans-serif">超短版（banner）：信而可托，朴而求真；循期沉淀，拓路生长</text>
</svg>
